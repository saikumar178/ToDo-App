version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app            # mount source code for live reload
      - /app/node_modules         # avoid overriding node_modules
    environment:
      - PORT=5000
      - MONGO_URL=MONGO_URL=mongodb+srv://testuser:test123@todo-cluster.yhmdnis.mongodb.net/?retryWrites=true&w=majority&appName=todo-cluster
      - JWT_SECRET=your_secret_key
    command: npm run dev          # 👈 override CMD if needed

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=https://todo-backend-herc.onrender.com/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
